<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0e0716" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Magmafy CRM</title>
    <script>
      /* Apply the saved theme and language before first paint (no flash). Dark is the default. */
      (function () {
        try {
          var t = localStorage.getItem('mg-crm-theme') || 'dark';
          if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('mg-crm-lang');
          if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Magmafy CRM needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
